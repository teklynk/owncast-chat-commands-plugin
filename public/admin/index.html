<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Commands</title>
    <style>
      :root {
        font-family: inherit;
      }

      body {
        margin: 0;
        padding: 1rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 1rem;
      }

      #command-list {
        display: grid;
        gap: 1rem;
        margin: 1rem 0;
      }

      .command {
        border: 1px solid currentColor;
        border-radius: 4px;
        padding: 1rem;
      }

      .fields {
        display: grid;
        grid-template-columns: minmax(12rem, 1fr) minmax(8rem, 12rem);
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.35rem;
        margin-bottom: 1rem;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
      }

      textarea {
        min-height: 6rem;
        resize: vertical;
      }

      .enabled {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .enabled input {
        width: auto;
      }

      .command-name-row {
        display: flex;
        align-items: flex-end;
        gap: 0.75rem;
      }

      .command-name-row .enabled {
        flex: 0 0 auto;
        margin-bottom: 1rem;
      }

      .command-name-field {
        flex: 1;
        min-width: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }

      #status {
        min-height: 1.5em;
      }

      @media (max-width: 520px) {
        .fields {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }
    </style>
  </head>
  <body>
    <h1>Chat Commands</h1>
    <p>Replies are selected at random. Set cooldown to 0 to disable it.</p>
    <div id="command-list" aria-live="polite"></div>
    <div class="actions">
      <button id="add-command" type="button">Add command</button>
      <button id="save" type="button">Save commands</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>

    <script>
      const endpoint = "api/commands";
      const list = document.querySelector("#command-list");
      const status = document.querySelector("#status");
      const saveButton = document.querySelector("#save");
      let commands = [];
      let statusTimeout;

      function showSaved() {
        status.textContent = "Saved.";
        window.clearTimeout(statusTimeout);
        statusTimeout = window.setTimeout(() => {
          if (status.textContent === "Saved.") status.textContent = "";
        }, 3000);
      }

      function makeField(labelText, value, onChange, options = {}) {
        const label = document.createElement("label");
        const caption = document.createElement("span");
        const input = document.createElement(options.multiline ? "textarea" : "input");
        caption.textContent = labelText;
        if (options.type) input.type = options.type;
        if (options.min !== undefined) input.min = options.min;
        if (options.max !== undefined) input.max = options.max;
        input.value = value;
        input.required = options.required !== false;
        input.addEventListener("input", () => onChange(input.value));
        label.append(caption, input);
        return label;
      }

      function render() {
        list.replaceChildren();
        commands.forEach((command, index) => {
          const section = document.createElement("section");
          section.className = "command";
          section.setAttribute("aria-label", `Command ${index + 1}`);

          const fields = document.createElement("div");
          fields.className = "fields";
          const commandNameRow = document.createElement("div");
          commandNameRow.className = "command-name-row";

          const enabledLabel = document.createElement("label");
          enabledLabel.className = "enabled";
          const enabled = document.createElement("input");
          enabled.type = "checkbox";
          enabled.checked = command.enabled !== false;
          enabled.addEventListener("change", () => { command.enabled = enabled.checked; });
          const enabledText = document.createElement("span");
          enabledText.textContent = "Enabled";
          enabledLabel.append(enabled, enabledText);

          const commandField = makeField("Command", command.command, (value) => {
            command.command = value;
          });
          commandField.className = "command-name-field";
          commandNameRow.append(enabledLabel, commandField);
          fields.append(
            commandNameRow,
            makeField("Cooldown (seconds)", command.cooldownSeconds, (value) => {
              command.cooldownSeconds = value === "" ? "" : Number(value);
            }, { type: "number", min: 0, max: 86400 }),
          );

          section.append(
            fields,
            makeField("Replies (one per line, up to 10)", command.messages.join("\n"), (value) => {
              command.messages = value.split("\n");
            }, { multiline: true }),
          );

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remove command";
          remove.addEventListener("click", () => {
            commands.splice(index, 1);
            render();
          });
          section.append(remove);
          list.append(section);
        });
      }

      async function request(url, options) {
        const response = await fetch(url, options);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);
        return result;
      }

      async function load() {
        try {
          const result = await request(endpoint);
          commands = result.commands;
          render();
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
        }
      }

      document.querySelector("#add-command").addEventListener("click", () => {
        commands.push({ command: "!new-command", messages: ["Add a reply"], cooldownSeconds: 0, enabled: true });
        render();
      });

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;
        status.textContent = "Saving...";
        try {
          const result = await request(endpoint, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(commands),
          });
          commands = result.commands;
          render();
          showSaved();
        } catch (error) {
          status.textContent = error.message;
        } finally {
          saveButton.disabled = false;
        }
      });

      load();
    </script>
  </body>
</html>
