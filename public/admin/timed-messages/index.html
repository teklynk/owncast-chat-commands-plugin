<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timed Messages</title>
    <link rel="stylesheet" href="../assets/styles.css">
  </head>
  <body>
    <h1>Timed Messages</h1>
    <p>Post a message on a schedule or after a number of viewer chat messages. Bot messages are not counted.</p>
    <div id="message-list" aria-live="polite"></div>
    <div class="actions">
      <button id="add-message" type="button">Add timed message</button>
      <button id="save" type="button">Save timed messages</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>

    <script>
      const endpoint = "../api/timed-messages";
      const list = document.querySelector("#message-list");
      const status = document.querySelector("#status");
      const saveButton = document.querySelector("#save");
      let timedMessages = [];
      let statusTimeout;

      function showSaved() {
        status.textContent = "Saved.";
        window.clearTimeout(statusTimeout);
        statusTimeout = window.setTimeout(() => {
          if (status.textContent === "Saved.") status.textContent = "";
        }, 3000);
      }

      function makeField(labelText, value, onChange, options = {}) {
        const label = document.createElement("label");
        const caption = document.createElement("span");
        const input = document.createElement(options.select ? "select" : options.multiline ? "textarea" : "input");
        caption.textContent = labelText;

        if (options.select) {
          options.select.forEach(([optionValue, optionLabel]) => {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = optionLabel;
            input.append(option);
          });
        } else {
          input.type = options.type || "text";
          if (options.min !== undefined) input.min = options.min;
          if (options.max !== undefined) input.max = options.max;
        }

        input.value = value;
        input.required = true;
        input.addEventListener(options.select ? "change" : "input", () => onChange(input.value));
        label.append(caption, input);
        return label;
      }

      function render() {
        list.replaceChildren();
        timedMessages.forEach((item, index) => {
          const section = document.createElement("section");
          section.className = "timed-message";
          section.setAttribute("aria-label", `Timed message ${index + 1}`);

          const fields = document.createElement("div");
          fields.className = "fields";

          const enabledLabel = document.createElement("label");
          enabledLabel.className = "enabled";
          const enabled = document.createElement("input");
          enabled.type = "checkbox";
          enabled.checked = item.enabled;
          enabled.addEventListener("change", () => { item.enabled = enabled.checked; });
          const enabledText = document.createElement("span");
          enabledText.textContent = "Enabled";
          enabledLabel.append(enabled, enabledText);

          const triggerRow = document.createElement("div");
          triggerRow.className = "trigger-row";
          const triggerField = makeField("Trigger", item.trigger, (value) => {
            if (item.trigger !== value) {
              item.trigger = value;
              render();
            }
          }, { select: [["interval", "Time interval"], ["chat-count", "Chat message count"]] });
          triggerField.className = "trigger-field";
          triggerRow.append(enabledLabel, triggerField);

          fields.append(
            triggerRow,
            makeField(
              item.trigger === "interval" ? "Post every (minutes)" : "Post after (chat messages)",
              item.trigger === "interval" ? item.intervalMinutes : item.chatMessageCount,
              (value) => {
                if (item.trigger === "interval") item.intervalMinutes = value === "" ? "" : Number(value);
                else item.chatMessageCount = value === "" ? "" : Number(value);
              },
              item.trigger === "interval"
                ? { type: "number", min: 1, max: 1440 }
                : { type: "number", min: 1, max: 10000 },
            ),
          );

          const messageField = makeField("Chat message", item.message, (value) => {
            item.message = value;
          }, { multiline: true });
          messageField.querySelector("textarea").maxLength = 300;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remove timed message";
          remove.addEventListener("click", () => {
            timedMessages.splice(index, 1);
            render();
          });

          section.append(fields, messageField, remove);
          list.append(section);
        });
      }

      async function request(url, options) {
        const response = await fetch(url, options);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);
        return result;
      }

      async function load() {
        try {
          const result = await request(endpoint);
          timedMessages = result.timedMessages;
          render();
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
        }
      }

      document.querySelector("#add-message").addEventListener("click", () => {
        timedMessages.push({
          id: `timed-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`,
          message: "Add your message here",
          trigger: "interval",
          intervalMinutes: 30,
          chatMessageCount: 20,
          enabled: true,
        });
        render();
      });

      saveButton.addEventListener("click", async () => {
        saveButton.disabled = true;
        status.textContent = "Saving...";
        try {
          const result = await request(endpoint, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(timedMessages),
          });
          timedMessages = result.timedMessages;
          render();
          showSaved();
        } catch (error) {
          status.textContent = error.message;
        } finally {
          saveButton.disabled = false;
        }
      });

      load();
    </script>
  </body>
</html>
